aid: parallel-markets
name: Parallel Markets
description: >-
  Parallel Markets (an iCapital company) is the leader in reusable financial identity,
  providing an end-to-end solution for investor onboarding, verification, and monitoring.
  Its platform handles investor accreditation for 506(c) offerings, Know-Your-Customer
  (KYC), Know-Your-Business (KYB), Anti-Money-Laundering (AML) and sanctions/risk
  monitoring, beneficial-ownership mapping, and identity verification. Partners integrate
  a client-side JavaScript SDK that collects user information in an accreditation, KYC,
  KYB, or general onboarding flow, plus a server-side REST API (Server API and Case
  Management API) and signed webhooks that push accreditation, identity, and risk
  updates. The reusable "Passport" lets users assert their identity and accreditation
  status across third-party platforms. Trusted by investment advisors, asset managers,
  brokers, and fundraising platforms.
